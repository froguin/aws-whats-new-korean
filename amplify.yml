version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - |
          if [ -f amplify_outputs.json ]; then
            API_URL=$(node -p "JSON.parse(require('fs').readFileSync('amplify_outputs.json','utf8')).custom?.apiUrl || ''")
            export VITE_API_URL="$API_URL"
            echo "VITE_API_URL=$API_URL"
          fi
        - npm run build
    postBuild:
      commands:
        - mkdir -p .amplify-hosting/static
        - cp -r dist/* .amplify-hosting/static/
        - printf '{"version":1,"routes":[{"path":"/*","target":{"kind":"Static"}}],"framework":{"name":"vite","version":"6.0.0"}}' > .amplify-hosting/deploy-manifest.json
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
