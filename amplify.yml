version: 1
backend:
  phases:
    build:
      commands:
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
        - rm -f dist/deploy-manifest.json
        - mkdir -p dist/static
        - find dist -mindepth 1 -maxdepth 1 ! -name static -exec mv {} dist/static/ \;
        - |
          cat > dist/deploy-manifest.json <<'EOF'
          {
            "version": 1,
            "routes": [
              {
                "path": "/*",
                "target": {
                  "kind": "Static"
                },
                "fallback": {
                  "kind": "Static",
                  "uri": "/index.html"
                }
              }
            ],
            "framework": {
              "name": "astro",
              "version": "5"
            }
          }
          EOF
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
