version: 1
backend:
  phases:
    build:
      commands:
        - |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "amplify/")
          if echo "$CHANGED" | grep -qE '^(amplify/|package)'; then
            echo "백엔드 변경 감지, 배포 진행"
            npm install
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
          else
            echo "백엔드 변경 없음, 스킵"
          fi
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - |
          if [ -f amplify_outputs.json ]; then
            API_URL=$(node -p "JSON.parse(require('fs').readFileSync('amplify_outputs.json','utf8')).custom?.apiUrl || ''")
            export VITE_API_URL="$API_URL"
            echo "VITE_API_URL=$API_URL"
            RUM_ID=$(node -p "JSON.parse(require('fs').readFileSync('amplify_outputs.json','utf8')).custom?.rumIdentityPoolId || ''")
            export VITE_RUM_IDENTITY_POOL_ID="$RUM_ID"
            echo "VITE_RUM_IDENTITY_POOL_ID=$RUM_ID"
          fi
          npm run build
    postBuild:
      commands:
        - mkdir -p .amplify-hosting/static
        - cp -r dist/* .amplify-hosting/static/
        - printf '{"version":1,"routes":[{"path":"/*","target":{"kind":"Static"}}],"framework":{"name":"vite","version":"6.0.0"}}' > .amplify-hosting/deploy-manifest.json
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
