AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private bucket for the zipped Lambda code of the release backend (stack awskr-backend-artifacts).
  Deploy once in ap-northeast-2 before package.sh. Objects expire after 90 days.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-builds
            Status: Enabled
            ExpirationInDays: 90

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
