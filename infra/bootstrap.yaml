AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap for push-driven infra deploys of the awskr.net sites.
  Creates (1) a CloudFormation execution role that owns the broad resource permissions and
  (2) a narrow GitHub OIDC role that can only run awskr-* stacks and pass that execution role.
  Deploy ONCE by hand (CI cannot bootstrap itself):
    aws cloudformation deploy --region us-east-1 --stack-name awskr-infra-bootstrap \
      --template-file bootstrap.yaml --capabilities CAPABILITY_NAMED_IAM

Parameters:
  GitHubSubjects:
    Type: CommaDelimitedList
    Description: >-
      OIDC subjects (main branch only) allowed to deploy infra. These are the exact values GitHub
      emits for each repo (bedrock uses the immutable owner@id/repo@id format). kiro-handbook and
      amazon-quick-handbook stay on Amplify (the account allows only 3 FREE flat-rate plans), so they are
      not listed; add their subjects here again if they ever move.
    Default: >-
      repo:froguin/aws-whats-new-korean:ref:refs/heads/main,
      repo:froguin@1848532/bedrock-pricing-compare@1423976117:ref:refs/heads/main
  HostedZoneId:
    Type: String
    Default: Z01517412DUMQ2XQU1189

Resources:
  # ------------------------------------------------------------------ CloudFormation execution role
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: awskr-infra-cfn-execution
      Description: Assumed by CloudFormation to create the awskr.net site stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: awskr-site-stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SiteBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:DeleteBucketPolicy
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                Resource: !Sub 'arn:${AWS::Partition}:s3:::awskr-*'
              - Sid: CloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:CreateFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:DeleteFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:PublishFunction
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:AssociateAlias
                  - cloudfront:ListDistributions
                Resource: '*'
              - Sid: WebAcl
                Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:ListWebACLs
                  - wafv2:ListTagsForResource
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - wafv2:GetManagedRuleSet
                  - wafv2:ListAvailableManagedRuleGroups
                  - wafv2:DescribeManagedRuleGroup
                  - wafv2:CheckCapacity
                Resource: '*'
              - Sid: Certificate
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              - Sid: DnsRecords
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'
              - Sid: DnsChangeStatus
                Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'
              - Sid: SiteDeployRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/awskr-site-*'
              - Sid: FlatRatePlan
                Effect: Allow
                # ApprovePaidSubscription is deliberately absent: a human approves any paid plan.
                Action:
                  - pricingplanmanager:CreateSubscription
                  - pricingplanmanager:GetSubscription
                  - pricingplanmanager:ListSubscriptions
                  - pricingplanmanager:UpdateSubscription
                  - pricingplanmanager:CancelSubscription
                  - pricingplanmanager:CancelSubscriptionChange
                  - pricingplanmanager:AssociateResourcesToSubscription
                  - pricingplanmanager:DisassociateResourcesFromSubscription
                Resource: '*'
              - Sid: FlatRatePlanRelatedReads
                Effect: Allow
                # Listed in the AWS managed policy PricingPlanManagerFullAccess; the plan service reads these
                # (Free Tier plan state, usage metrics, Shield Advanced protections) when creating a subscription.
                Action:
                  - freetier:GetAccountPlanState
                  - cloudwatch:GetMetricData
                  - shield:ListProtections
                Resource: '*'

  # ------------------------------------------------------------------ GitHub Actions role
  InfraDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: awskr-infra-deploy
      Description: GitHub Actions (main branch of the awskr.net repos) -> run awskr-* CloudFormation stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjects
      Policies:
        - PolicyName: run-awskr-stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:TagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/awskr-site-*/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/awskr-wildcard-cert/*'
              - Sid: ReadOnlyHelpers
                Effect: Allow
                Action:
                  - cloudformation:ListExports
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: WhoAmI
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
              - Sid: PassExecutionRoleToCloudFormationOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # ------------------------------------------------------------------ backend deployment roles
  BackendCfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: awskr-backend-cfn-execution
      Description: CloudFormation execution role for the awskr Whats New data pipeline.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: awskr-backend-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaFunctions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:awskr-backend-whatsnew-*'
              - Sid: LambdaEventSources
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource: '*'
              - Sid: BackendTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/awskr-backend-whatsnew-*'
              - Sid: BackendQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub 'arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:awskr-backend-whatsnew-*'
              - Sid: BackendRules
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                Resource: !Sub 'arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/awskr-backend-whatsnew-*'
              - Sid: BackendApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource: !Sub 'arn:${AWS::Partition}:apigateway:*::/apis*'
              - Sid: BackendLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                Resource: !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/awskr-backend-whatsnew-*'
              - Sid: BackendFunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/awskr-backend-whatsnew-*'
              - Sid: PassBackendFunctionRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/awskr-backend-whatsnew-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ReadLambdaArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::awskr-backend-artifacts-*/*'

  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: awskr-backend-deploy
      Description: GitHub Actions main branch deploy role for the awskr Whats New backend.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjects
      Policies:
        - PolicyName: package-and-deploy-whats-new-backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadArtifacts
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::awskr-backend-artifacts-*/*'
              - Sid: ReadBackendStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/awskr-backend-artifacts/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/awskr-backend-whatsnew/*'
              - Sid: ValidateBackendTemplate
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: DeployBackendStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/awskr-backend-whatsnew/*'
              - Sid: PassBackendExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BackendCfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: SeedStaticSnapshot
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:awskr-backend-whatsnew-publisher'
              - Sid: WhoAmI
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

Outputs:
  BackendDeployRoleArn:
    Description: Set as the GitHub repository variable AWS_BACKEND_DEPLOY_ROLE_ARN in aws-whats-new-korean.
    Value: !GetAtt BackendDeployRole.Arn
  BackendCfnExecutionRoleArn:
    Value: !GetAtt BackendCfnExecutionRole.Arn
  InfraDeployRoleArn:
    Description: Set as the GitHub repository variable AWS_INFRA_ROLE_ARN in each site repo.
    Value: !GetAtt InfraDeployRole.Arn
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn
