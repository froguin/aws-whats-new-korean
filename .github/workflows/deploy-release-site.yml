name: Deploy release site (S3 + CloudFront)

# Builds the Vite frontend and publishes it to the release.awskr.net bucket behind the
# CloudFront flat-rate distribution (stack awskr-site-aws-whats-new-korean).
# The Amplify Gen2 backend (API, pipeline) is still deployed by Amplify; only hosting moved.
#
# Repository variables needed (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_SITE_ROLE_ARN              DeployRoleArn output of the site stack
#   VITE_API_URL                   apiUrl from the backend's customOutputs
# These values are visible in the shipped JavaScript anyway; none is a secret.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-release-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-release-site
  cancel-in-progress: false

env:
  BUCKET: awskr-whats-new-korean-site
  DISTRIBUTION_ID: E2HJ7VXYH75Y9F
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Same fallback as amplify.yml: this project's lockfile has peer-dependency quirks
        # (@aws-amplify/backend vs aws-cdk-lib) that make a strict `npm ci` fail.
        run: npm ci || npm install

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "VITE_API_URL variable is empty" >&2; exit 1; }
          npm run build
          test -f dist/index.html

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SITE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3
        run: |
          # Hashed build assets: cache for a year.
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --no-progress \
              --cache-control "public, max-age=31536000, immutable"
          fi
          # Everything else except the entry page: short cache.
          aws s3 sync dist "s3://$BUCKET" --delete --no-progress \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=3600"
          # Entry page last, so it only references assets that already exist.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --no-progress \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
