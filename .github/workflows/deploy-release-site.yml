name: Deploy release site (S3 + CloudFront)

# Builds the Vite frontend and publishes it to the release.awskr.net bucket behind the
# CloudFront flat-rate distribution (stack awskr-site-aws-whats-new-korean).
# The backend (infra/backend) is a separate CloudFormation stack; the site only reads the
# static articles.json that the backend publisher writes to the bucket.
#
# Repository variable needed (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_SITE_ROLE_ARN              DeployRoleArn output of the site stack

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-release-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-release-site
  cancel-in-progress: false

env:
  BUCKET: awskr-whats-new-korean-site
  DISTRIBUTION_ID: E2HJ7VXYH75Y9F
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build
          test -f dist/index.html

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SITE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3
        run: |
          # Hashed build assets: cache for a year.
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --no-progress \
              --cache-control "public, max-age=31536000, immutable"
          fi
          # Everything else except the entry page: short cache.
          # NOTE: articles.json is written by the backend publisher (not the build),
          # so it must be excluded from --delete or every deploy would wipe it.
          aws s3 sync dist "s3://$BUCKET" --delete --no-progress \
            --exclude "assets/*" --exclude "index.html" --exclude "articles.json" \
            --cache-control "public, max-age=3600"
          # Entry page last, so it only references assets that already exist.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --no-progress \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query 'Invalidation.[Id,Status]' --output text
