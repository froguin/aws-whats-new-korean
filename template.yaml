AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS What's New Korean - RSS collection, translation pipeline, and web frontend

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  BedrockTranslateModel:
    Type: String
    Default: apac.amazon.nova-micro-v1:0
  BedrockReviewModel:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  GitHubRepository:
    Type: String
    Description: GitHub repository URL (https://github.com/owner/repo)
  GitHubAccessToken:
    Type: String
    NoEcho: true
    Description: GitHub personal access token for Amplify

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 300
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ArticlesTable
        QUEUE_URL: !Ref TranslationQueue
        ENVIRONMENT: !Ref Environment
        BEDROCK_TRANSLATE_MODEL: !Ref BedrockTranslateModel
        BEDROCK_REVIEW_MODEL: !Ref BedrockReviewModel

Resources:
  # ── DynamoDB ──
  ArticlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aws-whats-new-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── SQS ──
  TranslationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aws-whats-new-translation-${Environment}
      VisibilityTimeout: 600
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TranslationDLQ.Arn
        maxReceiveCount: 3

  TranslationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aws-whats-new-translation-dlq-${Environment}
      MessageRetentionPeriod: 604800

  # ── Lambda: RSS Collector ──
  RssCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub aws-whats-new-rss-collector-${Environment}
      Handler: index.handler
      CodeUri: functions/rss-collector/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TranslationQueue.QueueName
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Enabled: true

  # ── Lambda: Translator ──
  TranslatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub aws-whats-new-translator-${Environment}
      Handler: index.handler
      CodeUri: functions/translator/
      Timeout: 600
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/apac.amazon.*
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt TranslationQueue.Arn
            BatchSize: 1

  # ── Amplify Hosting ──
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub aws-whats-new-${Environment}
      Repository: !Ref GitHubRepository
      AccessToken: !Ref GitHubAccessToken
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - npm ci
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: dist
            files:
              - '**/*'
          cache:
            paths:
              - node_modules/**/*
      EnvironmentVariables:
        - Name: TABLE_NAME
          Value: !Ref ArticlesTable
        - Name: ENVIRONMENT
          Value: !Ref Environment
      IAMServiceRole: !GetAtt AmplifyRole.Arn

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      EnableAutoBuild: true

  # ── Amplify IAM Role ──
  AmplifyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub aws-whats-new-amplify-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt ArticlesTable.Arn
                  - !Sub ${ArticlesTable.Arn}/index/*

Outputs:
  TableName:
    Value: !Ref ArticlesTable
  QueueUrl:
    Value: !Ref TranslationQueue
  DLQUrl:
    Value: !Ref TranslationDLQ
  AmplifyAppUrl:
    Value: !Sub https://main.${AmplifyApp.DefaultDomain}
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
